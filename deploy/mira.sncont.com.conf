# v4.73 мини-приложение Миры. Наружу только /webapp/: /mira/* остаётся за Bearer и SSH-туннелем.
# v4.87 имя снова Mira, основной адрес снова mira.sncont.com (mila.sncont.com отдаёт 301 сюда).
server {
    listen 80;
    listen [::]:80;
    server_name mira.sncont.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mira.sncont.com;

    ssl_certificate /etc/letsencrypt/live/mira.sncont.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mira.sncont.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 64k;

    # v4.95: главная и политика конфиденциальности для экрана согласия Google (вход Миры в YouTube)
    location = /about { alias /var/www/mira/about.html; default_type text/html; add_header Cache-Control "no-cache" always; }
    location = /privacy { alias /var/www/mira/privacy.html; default_type text/html; add_header Cache-Control "no-cache" always; }

    location / {
        proxy_pass http://127.0.0.1:8787/webapp/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # v4.88.1: Telegram на iOS держал старую страницу в кэше; add_header здесь отменяет серверный, поэтому X-Robots-Tag повторён
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
