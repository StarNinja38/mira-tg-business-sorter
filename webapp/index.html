.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.acts button { min-height: 44px; padding: 0 14px; border-radius: var(--r-m); background: var(--raised); font-size: 14px; font-weight: 500; }
.acts .danger, .icon-btn.sure { background: var(--bad); color: #fff; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: var(--r-s); background: var(--raised); display: grid; place-items: center; font-size: 17px; }
.icon-btn.sure { width: auto; padding: 0 10px; font-size: 14px; font-weight: 600; }
.feed .row { align-items: flex-start; }
.feed .grow { min-width: 0; overflow-wrap: anywhere; }
.sendrow { display: flex; gap: 8px; }
.sendrow .text { flex: 1; min-width: 0; min-height: 44px; }

const dayData = () => PLAN[state.day] || { timed: [], free: [], pays: [] };
function renderDay() {
  $("week").innerHTML = DAYS.map(([w, n]) => `<button aria-pressed="${state.day === n}" data-day="${n}" aria-label="${n} число">${w}<b>${n}</b></button>`).join("");
  const d = dayData();
  const tasks = [...d.timed, ...d.free].filter(i => i.task);
  const isDone = i => state.closed[i.id] !== undefined ? state.closed[i.id] : !!i.done;
  const done = tasks.filter(isDone).length;
  const items = d.timed.length + d.free.length;
  $("ring").setAttribute("stroke-dashoffset", tasks.length ? 150.8 * (1 - done / tasks.length) : 150.8);
  $("pulse-big").textContent = tasks.length ? `${done} из ${tasks.length} задач` : "Задач нет";
  $("pulse-small").textContent = items ? `Всего в плане: ${items}` : "На этот день ничего нет";
  const row = i => {
    const closed = isDone(i);
    const lead = i.time ? `<span class="time">${esc(i.time)}</span>` : "";
    const end = i.task ? `<button class="check" role="checkbox" aria-checked="${closed}" aria-label="Закрыть: ${esc(i.t)}" data-check="${esc(i.id)}">${icon("check")}</button>` : `<span class="kind">${esc(i.kind)}</span>`;
    const body = `<span class="t">${esc(i.t)}</span>${i.s ? `<br><span class="s">${esc(i.s)}</span>` : ""}`;
    const main = i.who ? `<button class="grow" data-person="${esc(i.who)}">${body}</button>` : `<div class="grow">${body}</div>`;
    return `<div class="row ${closed ? "done" : ""}">${lead}${main}${end}</div>`;
  };
  $("timed").innerHTML = d.timed.length ? d.timed.map(row).join("") : `<p class="empty">Ничего по времени</p>`;
  $("free").innerHTML = d.free.map(row).join("");

  $("pays").innerHTML = (d.pays || []).map(p => `<div class="row"><p class="grow">${esc(p.t)}</p></div>`).join("");
  $("pay-sect").hidden = !(d.pays || []).length;
}

  return `<svg class="spark" width="72" height="22" viewBox="0 0 72 22" aria-hidden="true"><polyline fill="none" stroke-width="1.6" stroke="var(${up ? "--good" : "--bad"})" points="${pts}"/></svg>`;

    <div class="block">${c.examples.map((x, i) => `<button class="say" data-say="${i}" data-conn-id="${esc(id)}"><span class="grow">${esc(x)}</span><span class="say-go">↑</span></button>`).join("")}</div>
    <div class="block"><span class="lab">Об этом подключении</span><p class="bubble">${esc(c.about)}</p></div>${button}`);
}

function ask(text) {
  closeSheet();
  if (!LIVE) return toast("В примере чат не подключён");
  api("ask", { text }).then(() => { toast("Ответ придёт в чат"); setTimeout(() => tg.close(), 700); }).catch(fail);
}
const liveSkill = s => ({ id: s.id, e: s.emoji, name: s.name, cat: s.cat, sub: s.summary, on: s.installed, kind: s.kind, missing: s.missing, prompt: s.prompt,
  status: s.kind === "system" ? "Работает сам" : s.when || (s.last_run ? "Запускался" : "Установлен") });
function setSkills(rows) { SKILLS = rows.map(liveSkill); renderSkills(); }
function setConns(rows) { CONNS = rows; renderConns(); }
function setDay(d) {
  const n = +d.date.slice(8);
  PLAN[n] = d;
  [...d.timed, ...d.free].forEach(i => { if (i.task) state.closed[i.id] = !!i.done; });
}
async function boot() {
  const b = await api("bootstrap");
  INSIGHTS = b.insights; state.routines = b.routines; state.spent = b.spent; state.model = b.model; state.timezone = b.timezone;
  state.persona = { tone: b.persona.tone, len: b.persona.len, address: b.persona.address };
  state.auto = b.auto; state.memory = b.memory;
  const today = new Date(b.today + "T12:00:00");
  const monday = new Date(today); monday.setDate(today.getDate() - (today.getDay() + 6) % 7);
  const iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  DAYS = [...Array(7)].map((_, i) => { const x = new Date(monday); x.setDate(monday.getDate() + i); return ["ПнВтСрЧтПтСбВс".substr(i * 2, 2), x.getDate(), iso(x)]; });
  state.day = today.getDate();
  delete PLAN[2];
  setDay(b.day);
  setSkills(b.skills); setConns(b.connectors);
  $("sample-mark").hidden = true;
  $("hero-date").textContent = today.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" }).replace(/^./, c => c.toUpperCase());
  $("hello").textContent = "Привет, " + (state.persona.address || (tg.initDataUnsafe.user || {}).first_name || "босс");
  renderInsights(); renderDay(); renderSettings(); loadPeople(); loadMod();
}

document.addEventListener("click", e => {
  if (e.target === $("veil")) return closeSheet();
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  haptic();
  if (d.tab) return show(d.tab);
  if (d.mk) return loadMarket(d.mk);
  if (b.id === "mascot") { b.classList.remove("happy"); void b.offsetWidth; b.classList.add("happy"); return toast("Я на связи"); }
  if (d.open) return openNamed(d.open);
  if ("close" in d) return closeSheet();
  if (d.disc) return discoverSheet(d.disc);
  if (d.person !== undefined) return personSheet(d.person);
  if (d.skill) return skillSheet(d.skill);
  if (d.conn) return connSheet(d.conn);
  if (d.day) {
    state.day = +d.day;
    renderDay();
    const iso = DAYS.find(x => x[1] === state.day)[2];
    if (LIVE && !PLAN[state.day]) api(`day?date=${iso}`).then(r => { setDay(r); renderDay(); }).catch(fail);
    return;
  }
  if (d.check) {
    const item = [...dayData().timed, ...dayData().free].find(i => String(i.id) === d.check);
    const was = state.closed[item.id] !== undefined ? state.closed[item.id] : !!item.done;
    state.closed[item.id] = !was; renderDay();
    if (LIVE) api("task", { id: item.id, done: !was }).then(() => toast(was ? "Задача возвращена" : "Задача закрыта")).catch(err => { state.closed[item.id] = was; renderDay(); fail(err); });
    else toast(was ? "Задача возвращена" : "Задача закрыта");
    return;
  }
  if (d.filter) { state.filter = d.filter; renderPeople(); if (LIVE) loadPeople(); return; }
  if (d.persona) { state.persona[d.persona] = d.val; renderSettings(); return openNamed("persona"); }
  if ("savePersona" in d) {
    closeSheet();
    $("hello").textContent = "Привет, " + (state.persona.address.trim() || "босс");
    renderSettings();
    if (LIVE) api("persona", state.persona).then(() => toast("Сохранила")).catch(fail); else toast("Сохранила");
    return;
  }
  if (d.cat) { state.skillCat = d.cat; return openNamed("catalog"); }
  if (d.ccat) { state.connCat = d.ccat; return openNamed("library"); }
  if (d.sched !== undefined) { b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (d.enable || d.disable) {
    const on = !!d.enable, id = d.enable || d.disable;
    const pick = document.querySelector('#sched [aria-pressed="true"]');
    const schedule = on && pick ? SCHED[+pick.dataset.sched][1] : null;
    closeSheet();
    if (LIVE) return api("skill", { id, on, schedule }).then(r => { setSkills(r.skills); toast(r.note); }).catch(fail);
    SKILLS.find(s => s.id === id).on = on; renderSkills();
    return toast(on ? "Скилл установлен" : "Скилл убран");
  }
  if (d.toggle) {
    const c = CONNS.find(x => x.id === d.toggle), on = !c.on;
    closeSheet();
    if (LIVE) return api("connector", { id: c.id, on }).then(r => { setConns(r.connectors); setSkills(r.skills); toast(on ? "Подключено" : "Отключено"); }).catch(fail);
    c.on = on; renderConns();
    return toast(on ? "Подключено" : "Отключено");
  }
  if (d.say !== undefined) return ask(CONNS.find(x => x.id === d.connId).examples[+d.say]);
  if ("ask" in d) return ask(state.askText);
  if ("newSkill" in d) { const idea = $("skill-idea").value.trim(); if (!idea) return toast("Напиши, что нужно делать"); return ask(`Создай скилл: ${idea}`); }
  if (d.mod) return modCall("mod/decide", { token: d.mod, action: d.act });
  if (d.twmode) { const on = !state.mod.twitch.modes[d.twmode]; return modCall("twitch", { action: "mode", mode: d.twmode, on, value: +d.val }); }
  if (d.sayp) { state.sayP = d.sayp; return reopen(); }
  if (d.ytunban) return modCall("twitch", { action: "unban", user: d.ytunban, platform: "youtube" });
  if (d.ytmode) { const on = !state.mod.youtube.modes[d.ytmode]; return modCall("twitch", { action: "mode", mode: d.ytmode, on, value: +d.val, platform: "youtube" }); }
  if (d.twsay) return modCall("twitch", { action: "say", text: d.twsay, platform: sayTarget(state.mod) });
  if ("twsend" in d) { const text = $("tw-text").value.trim(); if (!text) return toast("Напиши сообщение"); return modCall("twitch", { action: "say", text, platform: sayTarget(state.mod) }); }
  if (d.feedp !== undefined) { state.feedP = d.feedp; return reopen(); }
  if (d.cto) return modCall("twitch", { action: "timeout", user: d.cto, minutes: 10, platform: d.cp });
  if (d.cban) {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Точно?"; return; }
    return modCall("twitch", { action: "ban", user: d.cban, reason: "из приложения", platform: d.cp });
  }
  if (d.auto) {
    const a = state.auto.find(x => x.id === d.auto), on = !a.on;
    a.on = on; reopen();
    if (LIVE) api("auto", { id: a.id, on }).then(r => { state.auto = r.auto; }).catch(err => { a.on = !on; reopen(); fail(err); });
    return;
  }
  if (d.forget !== undefined) {
    const fact = state.memory[+d.forget];
    const after = rows => { state.memory = rows; renderSettings(); openNamed("memory"); toast("Забыла"); };
    if (LIVE) return api("memory/forget", { text: fact.t }).then(r => after(r.memory)).catch(fail);
    return after(state.memory.filter(m => m !== fact));
  }
  if (d.routine) {
    const after = r => { state.routines = r; renderSettings(); openNamed("routines"); };
    if (LIVE) return api("routine/delete", { id: +d.routine }).then(r => after(r.routines)).catch(fail);
    return after(state.routines.filter(r => String(r.id) !== d.routine));
  }
  if (d.promise) {
    const who = d.who;
    if (LIVE) return api("task", { id: +d.promise, done: true }).then(() => { personSheet(who); toast("Обещание закрыто"); boot().catch(fail); }).catch(fail);
    PEOPLE[who].promises = PEOPLE[who].promises.filter(p => String(p.id) !== d.promise);
    personSheet(who);
    return toast("Обещание закрыто");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "people-search") { state.query = e.target.value; if (LIVE) loadPeople(); else renderPeople(); }
  if (id === "address") { state.persona.address = e.target.value; $("preview").textContent = previewText(); }
  if (id === "skill-search") { state.skillQuery = e.target.value; $("catalog-list").innerHTML = skillList(); }
  if (id === "conn-search") { state.connQuery = e.target.value; $("library-list").innerHTML = connList(); }
});
if (tg) tg.BackButton.onClick(closeSheet);

renderInsights(); renderModRow(); window.addEventListener("pageshow", renderCallDrafts); renderDiscover(); renderSkills(); renderConns(); renderDay(); renderPeople(); renderSettings();
let start = "mira";
try { start = localStorage.getItem("mira-tab") || start; } catch (e) {}
const fromHash = Object.keys(HASH).find(k => "#" + HASH[k] === location.hash);
const QS = new URLSearchParams(location.search);   // v4.112: кнопки из чата открывают нужный экран
const fromQuery = Object.keys(HASH).find(k => HASH[k] === QS.get("tab"));
show(fromQuery || fromHash || start);
if (QS.get("open") && SHEETS[QS.get("open")]) openNamed(QS.get("open"));
if (LIVE) boot().catch(fail);
setTimeout(() => { const sp = $("splash"); sp.style.opacity = 0; setTimeout(() => { sp.hidden = true; }, 350); }, LIVE ? 900 : 650);
</script>
